name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: careeros_ci
          POSTGRES_DB: careeros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careeros -d careeros_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://careeros:careeros_ci@127.0.0.1:5432/careeros_test
      WEB_ORIGIN: http://localhost:3000
      CLERK_ISSUER_URL: https://clerk.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e 'apps/api[dev]'
      - run: alembic -c apps/api/alembic.ini upgrade head
      - run: ruff check apps/api
      - run: ruff format --check apps/api
      - run: mypy apps/api/src
      - run: pytest apps/api/tests

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run web:lint
      - run: npm run web:typecheck
      - run: npm run web:test
      - run: npm run web:format
      - run: npm run web:build

  extension:
    runs-on: ubuntu-latest
    env:
      EXTENSION_API_URL: http://127.0.0.1:8000
      EXTENSION_WEB_URL: http://127.0.0.1:3000
      EXTENSION_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      EXTENSION_CLERK_FRONTEND_API: https://clerk.example.com
      EXTENSION_CLERK_SYNC_HOST: http://localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run extension:typecheck
      - run: npm run extension:test
      - run: npm run extension:format
      - run: npm run extension:build

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
