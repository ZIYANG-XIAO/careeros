<!doctype html>
<html lang="en">
  <body>
    <form id="application_form" action="/applications" method="post">
      <label for="first_name">First Name</label>
      <input
        id="first_name"
        name="first_name"
        autocomplete="given-name"
        required
      />
      <label for="last_name">Last Name</label>
      <input
        id="last_name"
        name="last_name"
        autocomplete="family-name"
        required
      />
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required />
      <label for="resume">Resume/CV</label>
      <input id="resume" type="file" name="resume" required />
      <label for="custom">Tell us about a project you are proud of</label>
      <textarea id="custom" name="question_123"></textarea>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
