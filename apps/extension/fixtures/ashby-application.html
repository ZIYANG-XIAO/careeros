<!doctype html>
<html lang="en">
  <body>
    <form data-testid="application-form" action="/application" method="post">
      <label>Email address <input type="email" name="email" /></label>
      <label>Current company <input name="current_company" /></label>
      <label>Current job title <input name="current_title" /></label>
      <label>
        Country
        <select name="country" autocomplete="country-name">
          <option>United States</option>
          <option>Canada</option>
        </select>
      </label>
      <label
        >Additional information <textarea name="additional"></textarea>
      </label>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
