<!doctype html>
<html lang="en">
  <body>
    <form class="application-form" action="/example/apply" method="post">
      <label>Full name <input name="name" autocomplete="name" /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>LinkedIn URL <input type="url" name="linkedin" /></label>
      <fieldset>
        <legend>Are you willing to relocate?</legend>
        <label><input type="radio" name="relocate" value="yes" /> Yes</label>
        <label><input type="radio" name="relocate" value="no" /> No</label>
      </fieldset>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
